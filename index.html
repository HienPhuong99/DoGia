<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo Google Sheet</title>
<style>
:root{--bg:#f4f4f2;--card:#fcfcfb;--text:#0b0b0b;--muted:#52514e;--line:#e4e3df;--track:#f0efec;--accent:#2a78d6;--down:#2a78d6;--up:#e34948;--warn-bg:#fef3c7;--warn:#92400e}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--card:#1a1a19;--text:#f0efec;--muted:#c3c2b7;--line:#2e2e2c;--track:#383835;--accent:#3987e5;--down:#3987e5;--up:#e66767;--warn-bg:#78350f;--warn:#fcd34d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
h3{font-size:14px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input{flex:1 1 260px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
label.sel{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px;flex:1 1 160px}
label.sel input{flex:none}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:13px;text-decoration:underline}
.warn{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 12px}
.chip{white-space:nowrap;border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi span{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:10px;margin-bottom:12px}
.bar{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:10px;align-items:center;padding:3px 0;font-size:13px}
.bar:hover{background:var(--track)}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:14px}
.bt i{display:block;height:100%;min-width:2px;background:var(--accent);border-radius:0 4px 4px 0}
.bt i.down{background:var(--down)}
.bt i.up{background:var(--up)}
.bv{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.more{font-size:12px;color:var(--muted);margin-top:6px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:600;white-space:nowrap}
.tag.down{color:var(--down)} .tag.up{color:var(--up)}
.new{font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 6px;margin-left:6px}
@media (max-width:560px){.bar{grid-template-columns:1fr auto}.bl{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <h1>Báo cáo Google Sheet</h1>
  <div class="sub">Dán link Google Sheet bất kỳ (đã chia sẻ “Bất kỳ ai có đường liên kết”) để xem biểu đồ và báo cáo.</div>
  <form class="row" id="form">
    <input id="link" type="url" placeholder="https://docs.google.com/spreadsheets/d/…" aria-label="Link Google Sheet" required>
    <button class="primary" type="submit">Xem báo cáo</button>
    <button type="button" class="linkbtn" id="reset">Dùng link mặc định</button>
  </form>
  <div class="warn" id="err" hidden></div>
  <div id="report" hidden>
    <div class="sub" id="status"></div>
    <div class="row">
      <label class="sel">Cột giá trị<select id="r-value"></select></label>
      <label class="sel">So với (giá cũ)<select id="r-cmp"></select></label>
      <label class="sel">Nhóm theo<select id="r-group"></select></label>
      <label class="sel">Tìm kiếm<input id="q" type="search" placeholder="vd: 15 pro 256"></label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="kpis" id="kpis"></div>
    <div class="charts" id="charts"></div>
    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
</main>
<script>
const DEFAULT_LINK = 'https://docs.google.com/spreadsheets/d/1pXlE41ArlhpHfkVwq83HpsHe2Y5-L6EhdHxBrqOkNdY/edit?gid=0';
const REFRESH_MS = 5 * 60 * 1000, TOP = 15, NEW_DAYS = 3;
const S = { link: '', headers: [], rows: [], cols: [], role: {}, q: '', group: '', sortJ: null, sortDir: 1 };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
const fmt = n => n.toLocaleString('vi-VN', { maximumFractionDigits: 2 });
const fmtDate = d => d.toLocaleDateString('vi-VN');
const avg = a => a.reduce((s, x) => s + x, 0) / a.length;

// "32.900.000", "1,234.5", "12,5", "500.000đ" -> số; "256GB" -> null
function num(s) {
  s = String(s ?? '').trim();
  if (!/^[-+]?\s*[$€₫]?\s*\d[\d.,\s]*\s*(đ|₫|vnđ|vnd|\$|€|%)?$/i.test(s)) return null;
  let t = s.replace(/[^\d.,-]/g, '');
  if (/^-?\d{1,3}([.,])\d{3}(\1\d{3})*$/.test(t)) t = t.replace(/[.,]/g, '');
  else if (t.includes('.') && t.includes(',')) t = t.lastIndexOf(',') > t.lastIndexOf('.') ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else t = t.replace(',', '.');
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}
// dd/mm/yyyy (kiểu Việt Nam) hoặc yyyy-mm-dd
function date(s) {
  s = String(s ?? '').trim();
  let m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if (m) return new Date(+m[3], m[2] - 1, +m[1]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? new Date(+m[1], m[2] - 1, +m[3]) : null;
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function csvUrl(link) {
  link = link.trim();
  const gid = (link.match(/[#&?]gid=(\d+)/) || [])[1] || '0';
  let m = link.match(/\/spreadsheets\/d\/e\/([\w-]+)/); // link "Xuất bản lên web"
  if (m) return `https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?output=csv&gid=${gid}`;
  m = link.match(/\/spreadsheets\/d\/([\w-]+)/) || link.match(/^([\w-]{25,})$/);
  return m ? `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&headers=1&gid=${gid}` : null;
}

// Đoán kiểu từng cột và vai trò: giá trị chính, giá cũ, nhóm, ngày
function analyze() {
  const keep = S.headers.map((_, j) => j).filter(j => S.headers[j].trim() || S.rows.some(r => (r[j] || '').trim()));
  S.cols = keep.map(j => {
    const vals = S.rows.map(r => (r[j] || '').trim()).filter(Boolean), n = vals.length || 1;
    const type = vals.filter(date).length / n >= .8 ? 'date' : vals.filter(v => num(v) != null).length / n >= .8 ? 'number' : 'text';
    return { j, name: S.headers[j].trim() || `Cột ${j + 1}`, type, distinct: new Set(vals).size };
  });
  const nums = S.cols.filter(c => c.type === 'number'), texts = S.cols.filter(c => c.type === 'text');
  const OLD = /cũ|old|trước|prev/i, MAIN = /giá|price|doanh|tiền|amount|total|tổng/i;
  const value = nums.find(c => MAIN.test(c.name) && !OLD.test(c.name)) || nums.find(c => !OLD.test(c.name)) || nums[0];
  const cmp = nums.find(c => c !== value && OLD.test(c.name));
  const group = texts.find(c => c.distinct > 1 && c.distinct <= 30 && c.distinct < S.rows.length);
  S.role = { value: value?.j ?? null, cmp: cmp?.j ?? null, group: group?.j ?? null, date: S.cols.find(c => c.type === 'date')?.j ?? null };
  const opts = (list, sel, none) => (none ? `<option value="">${none}</option>` : '') +
    list.map(c => `<option value="${c.j}"${c.j === sel ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  $('r-value').innerHTML = nums.length ? opts(nums, S.role.value) : '<option value="">(không có cột số)</option>';
  $('r-cmp').innerHTML = opts(nums, S.role.cmp, '(không so sánh)');
  $('r-group').innerHTML = opts(texts, S.role.group, '(không nhóm)');
}

const colName = j => S.cols.find(c => c.j === j)?.name || '';
function rowLabel(r) {
  const parts = S.cols.filter(c => c.type === 'text' && c.j !== S.role.group).map(c => (r[c.j] || '').trim()).filter(Boolean);
  return parts.join(' · ') || (S.role.group != null ? r[S.role.group] : '') || '—';
}
const bars = (title, data, note = '') => `<section class="card"><h3>${esc(title)}</h3>${
  data.map(d => `<div class="bar" title="${esc(d.tip || d.label + ': ' + d.text)}"><span class="bl">${esc(d.label)}</span>
    <span class="bt"><i class="${d.cls || ''}" style="width:${d.pct}%"></i></span><span class="bv">${esc(d.text)}</span></div>`).join('')
}${note ? `<div class="more">${esc(note)}</div>` : ''}</section>`;
const scale = (data, key) => { const m = Math.max(...data.map(d => Math.abs(d[key]))) || 1; data.forEach(d => d.pct = Math.abs(d[key]) / m * 100); return data; };

function render() {
  const R = S.role, words = norm(S.q).split(/\s+/).filter(Boolean);
  // Chips nhóm
  const groups = R.group == null ? [] : [...new Set(S.rows.map(r => r[R.group]).filter(Boolean))];
  $('chips').innerHTML = groups.length ? ['', ...groups].map(g =>
    `<button class="chip" type="button" data-g="${esc(g)}" aria-pressed="${g === S.group}">${esc(g || 'Tất cả')}</button>`).join('') : '';
  const rows = S.rows.filter(r => (!S.group || r[R.group] === S.group) && words.every(w => norm(r.join(' ')).includes(w)));
  const vName = colName(R.value), cName = colName(R.cmp);
  const it = R.value == null ? [] : rows.map(r => {
    const v = num(r[R.value]), o = R.cmp != null ? num(r[R.cmp]) : null;
    return { r, label: rowLabel(r), v, diff: o != null && v != null ? v - o : 0, d: R.date != null ? date(r[R.date]) : null };
  }).filter(x => x.v != null);

  // KPI
  const k = [['Số dòng', fmt(rows.length), S.group || 'toàn bộ dữ liệu']];
  if (it.length) {
    const lo = it.reduce((a, b) => b.v < a.v ? b : a), hi = it.reduce((a, b) => b.v > a.v ? b : a);
    const sorted = it.map(x => x.v).sort((a, b) => a - b), med = sorted[sorted.length >> 1];
    k.push([`${vName} trung bình`, fmt(Math.round(avg(sorted))), `trung vị ${fmt(med)}`],
      ['Thấp nhất', fmt(lo.v), lo.label], ['Cao nhất', fmt(hi.v), hi.label]);
    if (R.cmp != null) {
      const dn = it.filter(x => x.diff < 0), up = it.filter(x => x.diff > 0);
      k.push(['Giảm so với ' + cName, `↓ ${dn.length} mục`, dn.length ? `trung bình −${fmt(Math.round(-avg(dn.map(x => x.diff))))}` : 'không có'],
        ['Tăng so với ' + cName, `↑ ${up.length} mục`, up.length ? `trung bình +${fmt(Math.round(avg(up.map(x => x.diff))))}` : 'không có']);
    }
  }
  if (R.date != null) {
    const ds = rows.map(r => date(r[R.date])).filter(Boolean);
    if (ds.length) { const last = new Date(Math.max(...ds)); k.push(['Cập nhật gần nhất', fmtDate(last), `${ds.filter(d => +d === +last).length} mục trong ngày`]); }
  }
  $('kpis').innerHTML = k.map(([t, b, s]) => `<div class="kpi"><span>${esc(t)}</span><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');

  // Biểu đồ
  let html = '';
  if (it.length && R.group != null && !S.group) {
    const g = new Map();
    it.forEach(x => { const key = x.r[R.group] || '(trống)'; (g.get(key) || g.set(key, []).get(key)).push(x.v); });
    html += bars(`${vName} trung bình theo ${colName(R.group)}`, scale([...g].map(([label, vs]) => ({
      label, a: avg(vs), text: `${fmt(Math.round(avg(vs)))} · ${vs.length} mục`,
      tip: `${label}: TB ${fmt(Math.round(avg(vs)))}, thấp nhất ${fmt(Math.min(...vs))}, cao nhất ${fmt(Math.max(...vs))}` })), 'a'));
  }
  if (it.length) {
    const top = [...it].sort((a, b) => b.v - a.v);
    html += bars(`Xếp hạng ${vName} (cao → thấp)`, scale(top.slice(0, TOP).map(x => ({ label: x.label, v: x.v, text: fmt(x.v) })), 'v'),
      top.length > TOP ? `Hiển thị ${TOP}/${top.length} mục — xem đủ ở bảng bên dưới` : '');
  }
  const ch = it.filter(x => x.diff).sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
  if (ch.length) html += bars(`Thay đổi ${vName} so với ${cName}`, scale(ch.slice(0, TOP).map(x => ({
    label: x.label, diff: x.diff, cls: x.diff < 0 ? 'down' : 'up', text: `${x.diff < 0 ? '↓ −' : '↑ +'}${fmt(Math.abs(x.diff))}` })), 'diff'),
    `${ch.length} mục có thay đổi · ↓ giảm (xanh) · ↑ tăng (đỏ)`);
  if (!it.length) { // không có cột số: đếm số dòng theo từng cột phân loại
    const cats = S.cols.filter(c => c.type === 'text' && c.distinct > 1 && c.distinct <= 30 && c.distinct < S.rows.length).slice(0, 4);
    for (const c of cats) {
      const cnt = new Map();
      rows.forEach(r => { const v = (r[c.j] || '').trim() || '(trống)'; cnt.set(v, (cnt.get(v) || 0) + 1); });
      const data = [...cnt].sort((a, b) => b[1] - a[1]);
      html += bars(`Số dòng theo ${c.name}`, scale(data.slice(0, TOP).map(([label, n]) => ({ label, n,
        text: `${n} · ${Math.round(n / rows.length * 100)}%` })), 'n'), data.length > TOP ? `Hiển thị ${TOP}/${data.length} giá trị` : '');
    }
  }
  if (R.date != null) {
    const byDay = new Map();
    rows.forEach(r => { const d = date(r[R.date]); if (d) byDay.set(+d, (byDay.get(+d) || 0) + 1); });
    const days = [...byDay].sort((a, b) => b[0] - a[0]);
    if (days.length) html += bars(`Số mục theo ${colName(R.date)} (mới nhất trước)`,
      scale(days.slice(0, TOP).map(([d, n]) => ({ label: fmtDate(new Date(d)), n, text: `${n} mục` })), 'n'));
  }
  $('charts').innerHTML = html;

  // Bảng
  const cols = S.cols, sc = cols.find(c => c.j === S.sortJ);
  const showDiff = R.cmp != null && R.value != null;
  $('thead').innerHTML = '<tr>' + cols.map(c => `<th data-j="${c.j}">${esc(c.name)}${c.j === S.sortJ ? (S.sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') +
    (showDiff ? `<th data-j="diff">Thay đổi${S.sortJ === 'diff' ? (S.sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>` : '') + '</tr>';
  const key = S.sortJ === 'diff' ? r => (num(r[R.value]) ?? 0) - (num(r[R.cmp]) ?? num(r[R.value]) ?? 0)
    : !sc ? null : sc.type === 'number' ? r => num(r[sc.j]) ?? -Infinity : sc.type === 'date' ? r => +(date(r[sc.j]) || 0) : r => r[sc.j] || '';
  const list = key ? [...rows].sort((a, b) => { const x = key(a), y = key(b); return S.sortDir * (typeof x === 'string' ? x.localeCompare(y, 'vi') : x - y); }) : rows;
  const cutoff = Date.now() - NEW_DAYS * 864e5;
  $('tbody').innerHTML = list.map(r => '<tr>' + cols.map(c => {
    const v = r[c.j] || '', d = c.type === 'date' && date(v);
    return `<td${c.type === 'number' ? ' class="n"' : ''}>${esc(v)}${d && d >= cutoff ? '<span class="new">Mới</span>' : ''}</td>`;
  }).join('') + (showDiff ? (() => {
    const v = num(r[R.value]), o = num(r[R.cmp]), dlt = v != null && o != null ? v - o : 0;
    return `<td class="n">${dlt ? `<span class="tag ${dlt < 0 ? 'down' : 'up'}">${dlt < 0 ? '↓ −' : '↑ +'}${fmt(Math.abs(dlt))}</span>` : '—'}</td>`;
  })() : '') + '</tr>').join('') || `<tr><td colspan="${cols.length + 1}" class="sub">Không có dòng phù hợp</td></tr>`;
}

async function load(link, keepView) {
  const url = csvUrl(link);
  $('err').hidden = true;
  if (!url) { showErr('Link không đúng dạng Google Sheet.'); return; }
  try {
    const res = await fetch(url + '&_=' + Date.now());
    const text = await res.text();
    if (!res.ok || /^\s*</.test(text)) throw 0;
    const all = parseCSV(text).filter(r => r.some(c => c.trim()));
    if (!all.length) throw 1;
    S.headers = all[0]; S.rows = all.slice(1);
    const sameSheet = keepView && S.link === link;
    S.link = link;
    if (!sameSheet) { S.group = ''; S.sortJ = null; S.q = ''; $('q').value = ''; analyze(); }
    $('report').hidden = false;
    $('status').textContent = `${S.rows.length} dòng · ${S.cols.length} cột · tải lúc ${new Date().toLocaleTimeString('vi-VN')} · tự cập nhật mỗi 5 phút`;
    render();
  } catch (e) {
    if (!keepView) $('report').hidden = true;
    showErr(e === 1 ? 'Sheet trống.' : 'Không đọc được sheet. Hãy mở sheet → Chia sẻ → “Bất kỳ ai có đường liên kết” → Người xem, rồi bấm “Xem báo cáo” lại.');
  }
}
function showErr(msg) { $('err').textContent = msg; $('err').hidden = false; }
function openSheet(link) {
  $('link').value = link;
  const u = new URL(location.href);
  if (link === DEFAULT_LINK) u.searchParams.delete('sheet'); else u.searchParams.set('sheet', link);
  history.replaceState(null, '', u);
  load(link);
}

$('form').addEventListener('submit', e => { e.preventDefault(); openSheet($('link').value.trim()); });
$('reset').addEventListener('click', () => openSheet(DEFAULT_LINK));
$('q').addEventListener('input', e => { S.q = e.target.value; render(); });
for (const r of ['value', 'cmp', 'group']) $('r-' + r).addEventListener('change', e => {
  S.role[r] = e.target.value === '' ? null : +e.target.value;
  if (r === 'group') S.group = '';
  render();
});
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { S.group = b.dataset.g; render(); } });
$('thead').addEventListener('click', e => {
  const th = e.target.closest('th'); if (!th) return;
  const j = th.dataset.j === 'diff' ? 'diff' : +th.dataset.j;
  S.sortDir = S.sortJ === j ? -S.sortDir : 1; S.sortJ = j; render();
});

openSheet(new URLSearchParams(location.search).get('sheet') || DEFAULT_LINK);
setInterval(() => S.link && load(S.link, true), REFRESH_MS);
</script>
</body>
</html>
