<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>try{const t=localStorage.getItem('theme'),g=localStorage.getItem('tint');if(t)document.documentElement.dataset.theme=t;if(g)document.documentElement.style.setProperty('--tint',g)}catch{}</script>
<title>Theo dõi giá</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<style>
/* Liquid Glass (iOS 26/27): kính mờ trên nền màu, viền sáng phía trên + viền tối mảnh, chuyển động lò xo */
:root{color-scheme:light;--tint:.35;interpolate-size:allow-keywords;
--spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1);--out:cubic-bezier(.2,.9,.25,1);--ios:cubic-bezier(.32,.72,0,1);
--wall:#e8edf6;--b1:#7ec3ff;--b2:#c6a8ff;--b3:#ffb3c6;--b4:#9eeed3;
--text:#0b0b0f;--muted:rgba(60,60,67,.74);--faint:rgba(60,60,67,.52);--line:rgba(60,60,67,.14);--track:rgba(120,120,128,.13);
--accent:#007aff;--down:#0a6fe0;--up:#e5352b;--down-bg:rgba(0,122,255,.13);--up-bg:rgba(255,59,48,.13);--warn-bg:rgba(255,149,0,.18);--warn:#a85400;--star:#ff9f0a;
--g:255 255 255;--ga:calc(.4 + var(--tint)*.5);--bar-a:calc(.16 + var(--tint)*.22);--brd:rgba(255,255,255,.7);--bar-brd:rgba(255,255,255,.62);--edge:rgba(0,0,0,.09);--spec:rgba(255,255,255,.95);--spec-b:rgba(255,255,255,.58);--rim:rgba(255,255,255,.42);--sheen-t:rgba(255,255,255,.38);--sheen-b:rgba(255,255,255,.2);--glow:rgba(255,255,255,.55);
--sh:0 8px 28px rgba(40,50,90,.12);--sh-s:0 2px 8px rgba(40,50,90,.1);--bar-sh:inset 0 1.5px 1px var(--spec),inset 0 -1.5px 1.5px var(--spec-b),inset 0 0 12px var(--rim),0 0 0 .5px var(--edge),0 12px 32px rgba(20,30,60,.18);--lens:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.58));--solid:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--wall:#05060b;--b1:#1c48c9;--b2:#5f27c4;--b3:#a3185a;--b4:#0b6e5a;
--text:#f5f5f7;--muted:rgba(235,235,245,.72);--faint:rgba(235,235,245,.46);--line:rgba(235,235,245,.12);--track:rgba(120,120,128,.24);
--accent:#0a84ff;--down:#4aa3ff;--up:#ff6b61;--down-bg:rgba(10,132,255,.22);--up-bg:rgba(255,69,58,.22);--warn-bg:rgba(255,159,10,.2);--warn:#ffb340;
--g:30 30 36;--ga:calc(.36 + var(--tint)*.52);--bar-a:calc(.22 + var(--tint)*.26);--brd:rgba(255,255,255,.14);--bar-brd:rgba(255,255,255,.26);--edge:rgba(0,0,0,.6);--spec:rgba(255,255,255,.42);--spec-b:rgba(255,255,255,.18);--rim:rgba(255,255,255,.14);--sheen-t:rgba(255,255,255,.18);--sheen-b:rgba(255,255,255,.07);--glow:rgba(255,255,255,.1);
--sh:0 10px 30px rgba(0,0,0,.45);--sh-s:0 2px 8px rgba(0,0,0,.35);--bar-sh:inset 0 1.5px 1px var(--spec),inset 0 -1.5px 1.5px var(--spec-b),inset 0 0 14px var(--rim),0 0 0 .5px var(--edge),0 14px 36px rgba(0,0,0,.48);--lens:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.14));--solid:#1c1c1e}}
:root[data-theme=dark]{color-scheme:dark;--wall:#05060b;--b1:#1c48c9;--b2:#5f27c4;--b3:#a3185a;--b4:#0b6e5a;
--text:#f5f5f7;--muted:rgba(235,235,245,.72);--faint:rgba(235,235,245,.46);--line:rgba(235,235,245,.12);--track:rgba(120,120,128,.24);
--accent:#0a84ff;--down:#4aa3ff;--up:#ff6b61;--down-bg:rgba(10,132,255,.22);--up-bg:rgba(255,69,58,.22);--warn-bg:rgba(255,159,10,.2);--warn:#ffb340;
--g:30 30 36;--ga:calc(.36 + var(--tint)*.52);--bar-a:calc(.22 + var(--tint)*.26);--brd:rgba(255,255,255,.14);--bar-brd:rgba(255,255,255,.26);--edge:rgba(0,0,0,.6);--spec:rgba(255,255,255,.42);--spec-b:rgba(255,255,255,.18);--rim:rgba(255,255,255,.14);--sheen-t:rgba(255,255,255,.18);--sheen-b:rgba(255,255,255,.07);--glow:rgba(255,255,255,.1);
--sh:0 10px 30px rgba(0,0,0,.45);--sh-s:0 2px 8px rgba(0,0,0,.35);--bar-sh:inset 0 1.5px 1px var(--spec),inset 0 -1.5px 1.5px var(--spec-b),inset 0 0 14px var(--rim),0 0 0 .5px var(--edge),0 14px 36px rgba(0,0,0,.48);--lens:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.14));--solid:#1c1c1e}

.kpi,.card,.tablewrap,details.src,#tip,dialog{background:rgb(var(--g)/var(--ga));
-webkit-backdrop-filter:blur(20px) saturate(1.75);backdrop-filter:blur(20px) saturate(1.75);border:1px solid var(--brd);
box-shadow:inset 0 1px 0 var(--spec),0 0 0 .5px var(--edge),var(--sh)}
.top::before,.seg{background:rgb(var(--g)/var(--bar-a));
-webkit-backdrop-filter:blur(11px) saturate(2.1) contrast(1.06) brightness(1.03);backdrop-filter:blur(11px) saturate(2.1) contrast(1.06) brightness(1.03);border:1px solid var(--bar-brd);
box-shadow:var(--bar-sh)}
.btn,.chip,input:not([type=range]),select{background:rgb(var(--g)/var(--ga));
-webkit-backdrop-filter:blur(12px) saturate(1.5);backdrop-filter:blur(12px) saturate(1.5);border:1px solid var(--brd);
box-shadow:inset 0 1px 0 var(--spec),0 0 0 .5px var(--edge),var(--sh-s)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--wall);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:-18%;z-index:-1;pointer-events:none;background:radial-gradient(38% 32% at 18% 14%,var(--b1),transparent 70%),radial-gradient(34% 30% at 84% 16%,var(--b2),transparent 70%),radial-gradient(40% 36% at 74% 86%,var(--b3),transparent 70%),radial-gradient(36% 34% at 10% 84%,var(--b4),transparent 70%);transform:translateZ(0)}
main{max-width:1180px;margin:0 auto;padding:0 16px 48px}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.022em;margin:0;transform-origin:left center;transition:transform .34s var(--ios)}
h2{font-size:21px;letter-spacing:-.015em;margin:0}
h3{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 0 10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
h3 small{font-weight:400;color:var(--muted);font-size:12px}
.sub{color:var(--muted);font-size:13px}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select{font:inherit;color:inherit;border-radius:14px;padding:9px 14px;min-width:0;outline:none}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input::placeholder{color:var(--faint)}
button,summary,.mv,#track tbody tr,.chip,.cmp15-pill{touch-action:manipulation}
.btn{border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;white-space:nowrap;transition:transform .34s var(--ios),background-color .18s}
.btn:active,.chip:active{transform:scale(.94);transition-duration:.1s}
.btn.tint{background:color-mix(in srgb,var(--accent) 88%,transparent);border-color:rgba(255,255,255,.35);color:#fff}
.btn.icon{width:38px;height:38px;padding:0;font-size:17px;display:inline-grid;place-items:center}
.btn:disabled{opacity:.6;cursor:wait}

.top{position:sticky;top:max(10px,env(safe-area-inset-top));z-index:10;isolation:isolate;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 14px;margin:12px 0 14px;padding:14px 18px;border-radius:28px}
.top::before,.top::after,.seg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.top::before{z-index:-1;transition:background-color .24s ease}
.top::after,.seg::after{z-index:2;background:linear-gradient(180deg,var(--sheen-t) 0%,transparent 28%,transparent 74%,var(--sheen-b) 100%);box-shadow:inset 0 0 10px var(--rim)}
.scrolled .top{--bar-a:calc(.22 + var(--tint)*.26)}
.scrolled h1{transform:scale(.72)}
.brand{min-width:0}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-logo{width:34px;height:34px;padding:4px;border-radius:11px;flex-shrink:0;display:block;background:rgb(var(--g)/.62);border:1px solid var(--brd);box-shadow:inset 0 1px 0 var(--spec),0 2px 8px rgba(20,30,60,.1);transition:transform .34s var(--ios)}
.scrolled .brand-logo{transform:scale(.82)}
.acts{display:flex;gap:8px;align-items:center}
.upd{margin-top:2px;transition:opacity .22s ease}
.scrolled .upd{opacity:.78}
.upd b{color:var(--text);font-weight:600}

.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;touch-action:none}
.seg button{position:relative;z-index:1;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .18s,transform .32s var(--ios)}
.seg button:active{transform:scale(.93);transition-duration:.1s}
.seg button[aria-pressed=true]{color:var(--text)}
.lens{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:100px;transform-origin:left center;border-radius:999px;background:var(--lens);box-shadow:0 3px 12px rgba(0,0,0,.14),inset 0 1.5px 1px var(--spec),inset 0 -1px 1px var(--spec-b),0 0 0 .5px var(--edge);transition:transform .38s var(--ios);will-change:transform}
.lens.jelly{animation:jelly .42s var(--spring)}
@keyframes jelly{25%{scale:1.06 .92}}

details::details-content{block-size:0;overflow:hidden;opacity:0;transform:translateY(-4px);transition:block-size .38s var(--ios),opacity .26s ease,transform .36s var(--ios),content-visibility .38s allow-discrete}
details[open]::details-content{block-size:auto;opacity:1;transform:translateY(0)}
details.src{border-radius:22px;padding:12px 16px;margin-bottom:12px}
details.src summary,details.raw summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.src summary::-webkit-details-marker,details.raw summary::-webkit-details-marker{display:none}
details.src summary::after,details.raw summary::after{content:"›";font-size:20px;line-height:1;color:var(--muted);transition:rotate .42s var(--ios)}
details.src[open] summary::after,details.raw[open] summary::after{rotate:90deg}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
details.src .row{margin-top:10px}
details.src input[type=url]{flex:1 1 320px}
label.sel{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px;flex:1 1 150px}
label.sel input{flex:none}
input[type=range]{accent-color:var(--accent);padding:0;margin:8px 0}
.linkbtn{color:var(--accent);font-size:13px}
.warn{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:16px;font-size:14px;margin:8px 0;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

.filters{display:flex;gap:8px;margin-bottom:10px}
.filters input{flex:1 1 200px;border-radius:999px;padding:10px 16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;white-space:nowrap;scroll-snap-align:start;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;transition:transform .32s var(--ios),background-color .18s,color .18s}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 88%,transparent);color:#fff;border-color:rgba(255,255,255,.3)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:12px}
.kpi,.card{position:relative;border-radius:24px;padding:14px 16px;min-width:0;contain:layout style}
.kpi::before,.card::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:radial-gradient(380px circle at var(--mx,15%) var(--my,-40%),var(--glow),transparent 55%)}
.kpi b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.kpi span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:10px;margin-bottom:12px}
.wide{grid-column:1/-1}
.intro .kpi,.intro .card,.intro .tablewrap{animation:rise .52s var(--ios) both;animation-delay:calc(min(var(--i,4),6)*26ms)}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0) scale(.975)}}

.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%}
.chart text{font-size:11px;fill:var(--faint)}
.chart .grid-l{stroke:var(--line)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .est{stroke-dasharray:4 4}
.chart .dot{fill:var(--accent);stroke:var(--solid);stroke-width:2}
.chart .cross{stroke:var(--muted);stroke-dasharray:3 3}
#tip{position:fixed;pointer-events:none;color:var(--text);font-size:12px;font-weight:500;padding:6px 10px;border-radius:12px;white-space:nowrap;z-index:30;display:none;--ga:.78}
.bar{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:10px;align-items:center;padding:4px 6px;margin:0 -6px;border-radius:10px;font-size:13px}
.bar.me{font-weight:700}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:12px}
.bt i{display:block;height:100%;min-width:3px;background:var(--accent);border-radius:0 4px 4px 0;transform-origin:left center}
.intro .bt i{animation:grow .65s var(--ios) both .12s}
@keyframes grow{from{transform:scaleX(0)}}
.bv{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.more{font-size:12px;color:var(--muted);margin-top:6px}
.mv{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px;margin:0 -8px;border-radius:14px;border-bottom:.5px solid var(--line);font-size:14px;cursor:pointer;transition:background-color .16s,transform .3s var(--ios)}
.mv:last-child{border-bottom:0}
.mv:active{background:var(--track);transform:scale(.984);transition-duration:.08s}
.ml{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.n s{color:var(--faint);font-size:12px}
.chg{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chg.down{background:var(--down-bg);color:var(--down)}
.chg.up{background:var(--up-bg);color:var(--up)}
.chg.flat{color:var(--faint)}
.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));column-gap:28px}
.feed .mv:last-child{border-bottom:.5px solid var(--line)}
.feed a{text-decoration:none}
.tablewrap{overflow-x:auto;border-radius:24px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:.5px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
th.n{text-align:right}
tr:last-child td{border-bottom:0}
#track tbody tr,#raw tbody tr{content-visibility:auto;contain-intrinsic-size:auto 56px}
#track tbody tr{cursor:pointer;transition:background-color .16s,transform .3s var(--ios)}
#track tbody tr:active{background:var(--track);transform:scale(.992);transition-duration:.08s}
@media (hover:hover) and (pointer:fine){.bar:hover,.mv:hover,#track tbody tr:hover{background:var(--track)}}
.pname{font-weight:600}
.pcell{white-space:normal;min-width:150px}
.show-m{display:none;margin-top:3px}
.pgrp{font-size:12px;color:var(--muted)}
.star{padding:0 4px;font-size:19px;color:var(--faint);line-height:1;transition:transform .36s var(--spring),color .18s}
.star:active{transform:scale(.72);transition-duration:.08s}
.star[aria-pressed=true]{color:var(--star)}
.spark{display:block}
.spark.down{color:var(--down)} .spark.up{color:var(--up)} .spark.flat{color:var(--faint)}
.rng{position:relative;display:block;width:110px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--down-bg),var(--track),var(--up-bg))}
.rng i{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1)}
.rng.big{width:100%;height:8px;margin:14px 0 4px}
.rng-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.new{font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 7px;margin-left:6px;font-weight:600}
.verdict{display:inline-block;font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--track)}
.verdict.down{background:var(--down-bg);color:var(--down)} .verdict.up{background:var(--up-bg);color:var(--up)}

dialog{padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px);border-radius:34px;color:var(--text);--ga:calc(.55 + var(--tint)*.4);overscroll-behavior:contain}
dialog[open],dialog.closing{will-change:transform,opacity}
dialog[open]{animation:pop .36s var(--ios)}
dialog.closing{transform:translate3d(0,16px,0) scale(.95);opacity:0;transition:transform .24s var(--ios),opacity .2s ease}
dialog.closing::backdrop{opacity:0;transition:opacity .2s ease}
dialog .card{background:var(--track);-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--line);box-shadow:none;border-radius:16px}
dialog .card::before{display:none}
@keyframes pop{from{opacity:0;transform:translate3d(0,22px,0) scale(.94)}}
@keyframes iosDrop{from{opacity:0;transform:translate3d(0,-8px,0) scale(.985)}}
.cmp15-card{animation:iosDrop .28s var(--ios)}
dialog::backdrop{background:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:opacity .22s ease}
.dlg{padding:20px}
.dlg-h{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:10px;touch-action:none}
.big-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;margin:6px 0}
.big{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0;font-variant-numeric:tabular-nums}
.cmp15-btn{font-size:13px;padding:6px 12px}
.cmp15-card .ev{grid-template-columns:1fr auto}
.cmp15-opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cmp-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin:6px 0 8px;font-size:13px}
.cmp-bar-acts{display:flex;flex-wrap:wrap;gap:6px}
.cmp-pick{padding:8px 10px;margin:6px 0 10px;border-radius:14px;background:rgba(128,128,128,.08);border:.5px solid var(--line);animation:iosDrop .24s var(--ios)}
.cmp-pick .cmp15-opts{margin:6px 0 2px;max-height:170px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cmp-lbl{font-size:12px;color:var(--muted);margin:8px 0 2px}
.cmp15-pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;background:rgb(var(--g)/.58);border:1px solid var(--line);transition:transform .32s var(--ios),background-color .18s}
.cmp15-pill:active{transform:scale(.93);transition-duration:.08s}
.cmp15-pill[aria-pressed=true]{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.cmp15-total{font-size:18px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--track);border-radius:16px;padding:9px 12px}
.stats span{display:block;font-size:12px;color:var(--muted)}
.stats b{font-variant-numeric:tabular-nums}
.ev{display:grid;grid-template-columns:110px 1fr auto;gap:8px;padding:8px 0;border-bottom:.5px solid var(--line);font-size:14px}
.ev:last-child{border-bottom:0}
details.raw summary{cursor:pointer;font-weight:600;margin:16px 0 8px}

@media (max-width:640px){
main{padding:0 12px calc(96px + env(safe-area-inset-bottom))}
.top{top:max(8px,env(safe-area-inset-top));margin:8px 0 12px;padding:12px 14px;border-radius:24px}
.top{flex-wrap:nowrap;align-items:flex-start}
.brand-row{gap:8px}
.brand-logo{width:30px;height:30px;padding:3px;border-radius:9px}
h1{font-size:26px} .scrolled h1{transform:scale(.74)}
#refresh{width:38px;height:38px;padding:0;font-size:0;display:inline-grid;place-items:center}
#refresh::before{content:"⟳";font-size:19px}
.mv{grid-template-columns:1fr auto;row-gap:4px}.mv .ml{grid-column:1/-1;white-space:normal}
#range{position:fixed;z-index:20;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate3d(-50%,0,0);padding:4px;box-shadow:var(--bar-sh)}
#range button{padding:10px 15px;font-size:14px}
#range .lens{top:4px;bottom:4px}
.kpis{grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:12px 14px;border-radius:20px} .kpi b{font-size:19px}
.card{padding:14px;border-radius:22px}
#track th,#track td{padding:9px 8px}
.show-m{display:flex;flex-direction:column;align-items:flex-end;gap:4px} .pcell{min-width:0} .hide-m{display:none}
.ev{grid-template-columns:1fr auto}.ev span:first-child{grid-column:1/-1;color:var(--muted);font-size:12px}
.cmp15-card .ev span:first-child{grid-column:auto;color:var(--muted);font-size:13px}
.bar{grid-template-columns:1fr auto}.bl{grid-column:1/-1}
dialog{width:100%;max-width:100%;max-height:92dvh;margin:auto 0 0;border-radius:30px 30px 0 0;border-bottom:0}
dialog[open]{animation:sheet .36s var(--ios)}
dialog.closing{transform:translate3d(0,100%,0);opacity:1;transition:transform .28s var(--ios)}
.dlg{padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
.dlg::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--faint);opacity:.6;margin:0 auto 10px}
.big{font-size:30px}
}
@keyframes sheet{from{transform:translate3d(0,100%,0)}}
::view-transition,::view-transition-group(*){pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-reduced-transparency:reduce){:root{--tint:1!important;--bar-a:.94!important}}
@media (prefers-contrast:more){:root{--tint:1!important;--bar-a:.96!important;--muted:var(--text);--line:var(--faint)}}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <div class="brand-row">
        <img class="brand-logo" src="assets/logo.svg" alt="" width="34" height="34" decoding="async">
        <h1 id="title">Theo dõi giá</h1>
      </div>
      <div class="upd sub" id="status">Đang tải…</div>
    </div>
    <div class="acts">
      <div class="seg" id="range" role="group" aria-label="Khoảng thời gian"></div>
      <button type="button" class="btn tint" id="refresh">⟳ Cập nhật ngay</button>
      <button type="button" class="btn icon" id="theme" aria-label="Đổi giao diện sáng / tối">◐</button>
    </div>
  </header>

  <details class="src" id="src">
    <summary>Nguồn dữ liệu &amp; tuỳ chỉnh</summary>
    <form class="row" id="form">
      <input id="link" type="url" placeholder="Dán link Google Sheet (đã chia sẻ “Bất kỳ ai có đường liên kết”)" aria-label="Link Google Sheet" required>
      <button class="btn tint" type="submit">Xem báo cáo</button>
      <button type="button" class="linkbtn" id="reset">Dùng link mặc định</button>
    </form>
    <div class="row">
      <label class="sel">Cột giá<select id="r-value"></select></label>
      <label class="sel">Giá cũ (để so sánh)<select id="r-cmp"></select></label>
      <label class="sel">Nhóm theo<select id="r-group"></select></label>
      <label class="sel">Ngày cập nhật<select id="r-date"></select></label>
      <label class="sel">Độ trong của kính<input type="range" id="tint" min="0" max="1" step="0.05" aria-label="Độ trong của kính: trái trong suốt, phải mờ đục"></label>
    </div>
    <div class="sub" id="scanNote" style="margin-top:8px"></div>
  </details>
  <div class="warn" id="err" hidden></div>

  <div id="report" hidden>
    <div class="filters">
      <input id="q" type="search" placeholder="Tìm sản phẩm… (vd: 15 pro 256)" aria-label="Tìm kiếm">
    </div>
    <div class="chips" id="chips"></div>
    <div class="kpis" id="kpis"></div>
    <div id="track-area">
      <div class="grid">
        <section class="card wide" id="feedCard" hidden><h3>Biến động giá gần đây <small id="feedNote"></small></h3><div class="feed" id="feed"></div></section>
        <section class="card"><h3>Giảm giá mạnh nhất <small id="periodA"></small></h3><div id="moversDown"></div></section>
        <section class="card"><h3>Tăng giá mạnh nhất <small id="periodB"></small></h3><div id="moversUp"></div></section>
      </div>
      <h3 style="margin:18px 0 8px">Bảng theo dõi giá <small>bấm vào một dòng để xem lịch sử giá</small></h3>
      <div class="tablewrap"><table id="track"><thead id="tHead"></thead><tbody id="tBody"></tbody></table></div>
    </div>
    <div class="grid" id="countCharts"></div>
    <details class="raw" id="raw"><summary>Dữ liệu gốc từ sheet</summary>
      <div class="tablewrap"><table><thead id="rHead"></thead><tbody id="rBody"></tbody></table></div>
    </details>
  </div>
</main>
<div id="tip"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>
const DEFAULT_LINK = 'https://docs.google.com/spreadsheets/d/1pXlE41ArlhpHfkVwq83HpsHe2Y5-L6EhdHxBrqOkNdY/edit?gid=0';
const DEFAULT_ID = '1pXlE41ArlhpHfkVwq83HpsHe2Y5-L6EhdHxBrqOkNdY';
const RANGES = [[7, '7 ngày'], [30, '30 ngày'], [90, '90 ngày'], [0, 'Tất cả']];
const DAY = 864e5, TOP = 15, NEW_DAYS = 3, LOG_TAB = 'Biến động';
const today = new Date(); today.setHours(0, 0, 0, 0);
const S = { link: '', id: '', gid: '0', headers: [], rows: [], cols: [], role: {}, log: null,
  q: '', group: '', watchOnly: false, sortK: 'chg', sortDir: 1, rawJ: null, rawDir: 1, range: 30, watch: new Set(), items: [], open: null,
  cmp15Open: false, cmpPickOpen: false, cmpModel: '', cmp15Key: '', cmpDstKey: '', cmp15Fee: 'ext',
  tamLive: { map: new Map(), at: 0, loading: false, err: false } };

/* ---------- tiện ích ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
const fmt = n => n.toLocaleString('vi-VN', { maximumFractionDigits: 2 });
const fmtC = n => Math.abs(n) >= 1e6 ? fmt(+(n / 1e6).toFixed(1)) + ' tr' : Math.abs(n) >= 1e4 ? fmt(Math.round(n / 1e3)) + 'k' : fmt(n);
const fmtD = d => d ? d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }) : 'Trước đó';
const fmtDs = d => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
const pct = x => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x * 100).toFixed(1).replace('.', ',') + '%';
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const ago = d => { if (!d) return '—'; const n = Math.round((today - d) / DAY); return n <= 0 ? 'hôm nay' : n === 1 ? 'hôm qua' : `${n} ngày trước`; };
const chg = (c, base) => !c ? '<span class="chg flat">—</span>'
  : `<span class="chg ${c < 0 ? 'down' : 'up'}">${c < 0 ? '↓' : '↑'} ${fmtC(Math.abs(c))} · ${pct(c / base)}</span>`;

function num(s) { // "32.900.000", "1,234.5", "12,5", "500.000đ" -> số; "256GB" -> null
  s = String(s ?? '').trim();
  if (!/^[-+]?\s*[$€₫]?\s*\d[\d.,\s]*\s*(đ|₫|vnđ|vnd|\$|€|%)?$/i.test(s)) return null;
  let t = s.replace(/[^\d.,-]/g, '');
  if (/^-?\d{1,3}([.,])\d{3}(\1\d{3})*$/.test(t)) t = t.replace(/[.,]/g, '');
  else if (t.includes('.') && t.includes(',')) t = t.lastIndexOf(',') > t.lastIndexOf('.') ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else t = t.replace(',', '.');
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}
function date(s) { // dd/mm/yyyy hoặc yyyy-mm-dd
  s = String(s ?? '').trim();
  let m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if (m) return new Date(+m[3], m[2] - 1, +m[1]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? new Date(+m[1], m[2] - 1, +m[3]) : null;
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function sheetRef(link) {
  link = link.trim();
  const gid = (link.match(/[#&?]gid=(\d+)/) || [])[1] || '0';
  let m = link.match(/\/spreadsheets\/d\/e\/([\w-]+)/); // link "Xuất bản lên web"
  if (m) return { id: m[1], gid, pub: true, csv: `https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?output=csv&gid=${gid}` };
  m = link.match(/\/spreadsheets\/d\/([\w-]+)/) || link.match(/^([\w-]{25,})$/);
  return m ? { id: m[1], gid, csv: `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&headers=1&gid=${gid}` } : null;
}

/* ---------- đoán ý nghĩa cột ---------- */
function analyze() {
  const keep = S.headers.map((_, j) => j).filter(j => S.headers[j].trim() || S.rows.some(r => (r[j] || '').trim()));
  S.cols = keep.map(j => {
    const vals = S.rows.map(r => (r[j] || '').trim()).filter(Boolean), n = vals.length || 1;
    const type = vals.filter(date).length / n >= .8 ? 'date' : vals.filter(v => num(v) != null).length / n >= .8 ? 'number' : 'text';
    return { j, name: S.headers[j].trim() || `Cột ${j + 1}`, type, distinct: new Set(vals).size };
  });
  const nums = S.cols.filter(c => c.type === 'number'), texts = S.cols.filter(c => c.type === 'text'), dates = S.cols.filter(c => c.type === 'date');
  const OLD = /cũ|old|trước|prev/i, MAIN = /giá|price|doanh|tiền|amount|total|tổng/i;
  const value = nums.find(c => MAIN.test(c.name) && !OLD.test(c.name)) || nums.find(c => !OLD.test(c.name)) || nums[0];
  const cmp = nums.find(c => c !== value && OLD.test(c.name));
  const group = texts.find(c => c.distinct > 1 && c.distinct <= 30 && c.distinct < S.rows.length);
  S.role = { value: value?.j ?? null, cmp: cmp?.j ?? null, group: group?.j ?? null, date: dates[0]?.j ?? null };
  const opts = (list, sel, none) => (none ? `<option value="">${none}</option>` : '') +
    list.map(c => `<option value="${c.j}"${c.j === sel ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
  $('r-value').innerHTML = nums.length ? opts(nums, S.role.value) : '<option value="">(không có cột số)</option>';
  $('r-cmp').innerHTML = opts(nums, S.role.cmp, '(không có)');
  $('r-group').innerHTML = opts(texts, S.role.group, '(không nhóm)');
  $('r-date').innerHTML = opts(dates, S.role.date, '(không có)');
}
const textKey = r => S.cols.filter(c => c.type === 'text').map(c => (r[c.j] || '').trim()).join(' | ');
const rowLabel = r => S.cols.filter(c => c.type === 'text' && c.j !== S.role.group).map(c => (r[c.j] || '').trim()).filter(Boolean).join(' · ') || textKey(r) || '—';

/* ---------- tab "Biến động": mỗi dòng là một lần đổi giá (Gemini ghi mỗi sáng) ---------- */
// Ghép với tab chính qua các cột mô tả trùng tên (Model, Dung lượng, Tình trạng…).
function parseLog(text, mainText) {
  if (!text || text === mainText) return null; // sheet không có tab này thì Google trả về tab đầu
  const all = parseCSV(text), h = (all[0] || []).map(s => s.trim()), f = re => h.findIndex(x => re.test(x));
  const L = { t: f(/^ngày/i), cu: f(/giá cũ/i), p: f(/giá mới/i), src: f(/nguồn/i) };
  if (L.t < 0 || L.p < 0) return null;
  const pairs = h.map((n, j) => [S.cols.find(c => c.type === 'text' && norm(c.name) === norm(n))?.j, j])
    .filter(([m, j]) => m != null && !Object.values(L).includes(j));
  if (!pairs.length) return null;
  const map = new Map();
  for (const r of all.slice(1)) {
    const t = date(r[L.t]), p = num(r[L.p]); if (!t || p == null) continue;
    const k = pairs.map(([, j]) => norm((r[j] || '').trim())).join('|');
    (map.get(k) || map.set(k, []).get(k)).push({ t, p, cu: L.cu >= 0 ? num(r[L.cu]) : null, src: L.src >= 0 ? (r[L.src] || '').trim() : '' });
  }
  map.forEach(a => a.sort((x, y) => x.t - y.t));
  return { pairs, map };
}

/* ---------- đồng bộ giá trực tiếp từ tam300.com cho toàn bộ dòng máy ---------- */
const TAM_ORIGIN = 'https://tam300.com';
const TAM_SLUGS = ['iphone-17-series', 'iphone-16-series', 'iphone-15-series', 'iphone-14-series', 'iphone-13-series', 'iphone-12-series', 'iphone-11-series', 'iphone-x-series']
  .map(s => `${TAM_ORIGIN}/iphone/${s}`);
const capMb = s => { const m = String(s || '').match(/(\d+)\s*(GB|TB)/i); return m ? +m[1] * (/tb/i.test(m[2]) ? 1024 : 1) : 0; };
const capStr = s => (String(s || '').match(/\b(\d+\s*(?:GB|TB))\b/i) || ['', ''])[1].replace(/\s+/g, '').toUpperCase();
function seriesRank(g) {
  const s = norm(g);
  const m = s.match(/\biphone\s*(\d+)/) || s.match(/(\d+)/);
  if (m) return +m[1] * 10 + (/\bair\b/.test(s) ? 1 : 0);
  if (/\bair\b/.test(s)) return 175;
  if (/\bxs max\b/.test(s)) return 105;
  if (/\bxs\b|\bxr\b|\bx\b/.test(s)) return 100;
  if (/\bse\b/.test(s)) return 95;
  return 0;
}
function tamModelMeta(s) {
  const t = norm(s).replace(/\s+/g, ' ');
  const m = t.match(/(?:iphone\s*)?(\d{1,2}|xs max|xs|xr|x|se(?:\s*\d+)?)(?:\s*(pro max|pro|plus|mini|air)\b)?/);
  if (!m) return null;
  const gen = m[1], varName = m[2] || '';
  const cond = /new|seal|\bmoi\b|chua kich hoat/.test(t) && !/like|\bcu\b|99|2nd|da kich hoat|qua su dung|doi tra/.test(t) ? 'moi' : 'cu';
  const prettyGen = /^(xs max|xs|xr|x|se)/.test(gen) ? gen.toUpperCase().replace('XS MAX', 'XS Max') : gen;
  const prettyVar = varName ? ' ' + varName.replace(/\b\w/g, c => c.toUpperCase()) : '';
  const label = `iPhone ${prettyGen}${prettyVar}${cond === 'moi' ? ' (Newseal)' : ''}`;
  const rank = seriesRank(gen) * 10 + ({ 'pro max': 6, pro: 5, plus: 4, air: 3, '': 2, mini: 1 }[varName] || 0) + (cond === 'moi' ? .5 : 0);
  return { id: `${gen}${varName ? ' ' + varName : ''}|${cond}`, base: `${gen}${varName ? ' ' + varName : ''}`, label, cond, rank };
}
const tamItemKey = s => {
  const meta = tamModelMeta(s), c = capStr(s);
  return meta && c ? `${meta.base}|${c.toLowerCase()}|${meta.cond}` : null;
};
function parseTamPrice(s) {
  const t = String(s ?? '').trim();
  const tr = t.match(/(\d+(?:[.,]\d+)?)\s*tri[eệ]u/i);
  if (tr) return Math.round(parseFloat(tr[1].replace(',', '.')) * 1e6);
  const n = num(t);
  return n && n >= 1e6 ? Math.round(n) : null;
}

/* ---------- dựng chuỗi giá theo thời gian cho từng sản phẩm ---------- */
// Nguồn: tab "Biến động" nếu có; không thì cột giá cũ + ngày cập nhật, và giá hiện tại (đồng bộ live tam300.com nếu là sheet mặc định).
// Điểm t=null là "giá trước lần đổi đầu tiên đã ghi", không rõ từ ngày nào -> vẽ nét đứt.
const at = (pts, D) => { let p = pts[0].p; for (const x of pts) { if (!x.t || x.t <= D) p = x.p; else break; } return p; };
function buildItems() {
  const R = S.role, LG = S.log, useLive = S.id === DEFAULT_ID && S.tamLive.map.size > 0;
  if (R.value == null) return [];
  return S.rows.map(r => {
    const sheetV = num(r[R.value]); if (sheetV == null) return null;
    const lbl = rowLabel(r), tk = useLive ? tamItemKey(lbl) : null, live = tk ? S.tamLive.map.get(tk) : null;
    const v = live ? live.baseV : sheetV;
    const o = R.cmp != null ? num(r[R.cmp]) : null, d = R.date != null ? date(r[R.date]) : null, key = textKey(r);
    const ev = LG?.map.get(LG.pairs.map(([m]) => norm((r[m] || '').trim())).join('|')) || [];
    const raw = [];
    if (ev.length) {
      const last = ev[ev.length - 1];
      raw.push({ t: null, p: ev[0].cu ?? ev[0].p }, ...ev.map(e => ({ t: e.t, p: e.p })));
      if (last.p !== sheetV) raw.push({ t: d && d > last.t ? d : today, p: sheetV });
      if (v !== sheetV) raw.push({ t: today, p: v });
    } else if (o != null && o !== sheetV) {
      raw.push({ t: null, p: o }, { t: d || today, p: sheetV });
      if (v !== sheetV) raw.push({ t: today, p: v });
    } else if (v !== sheetV) {
      raw.push({ t: d, p: sheetV }, { t: today, p: v });
    } else raw.push({ t: d, p: v });
    raw.push({ t: today, p: v });
    raw.sort((a, b) => (a.t ? +a.t : -Infinity) - (b.t ? +b.t : -Infinity));
    const pts = raw.filter((x, i) => i === 0 || x.p !== raw[i - 1].p);
    const ps = pts.map(x => x.p);
    const lastT = pts.length > 1 ? pts[pts.length - 1].t : d;
    return { r, key, label: lbl, group: R.group != null ? r[R.group] : '', v, sheetV, tiers: live?.tiers || null,
      liveUrl: live?.url || '', pts, lo: Math.min(...ps), hi: Math.max(...ps),
      mean: avg(ps), changes: pts.length - 1, lastT, est: pts[0].t === null, ev };
  }).filter(Boolean);
}
function periodStart() {
  if (S.range) return new Date(+today - S.range * DAY);
  const ts = S.items.flatMap(i => i.pts.map(x => x.t)).filter(Boolean);
  return new Date(Math.min(+today - 7 * DAY, ts.length ? Math.min(...ts) - 3 * DAY : +today));
}
const periodName = () => S.range ? `${S.range} ngày qua` : 'toàn bộ lịch sử';
function withPeriod(items, t0) {
  for (const i of items) { i.base = S.range ? at(i.pts, t0) : i.pts[0].p; i.chg = i.v - i.base; i.pc = i.base ? i.chg / i.base : 0; }
  return items;
}

/* ---------- biểu đồ SVG ---------- */
function drawLine(el, s, t0, opts = {}) {
  const W = el.clientWidth || 600, H = +el.dataset.h || 200, P = { l: 58, r: 14, t: 14, b: 26 };
  const T0 = +t0, T1 = Math.max(+today, T0 + DAY), span = T1 - T0;
  const ps = s.map(x => x.p); let lo = Math.min(...ps), hi = Math.max(...ps);
  if (lo === hi) { lo -= Math.abs(lo) * .05 || 1; hi += Math.abs(hi) * .05 || 1; }
  const pad = (hi - lo) * .12; lo -= pad; hi += pad;
  const X = t => P.l + (t - T0) / span * (W - P.l - P.r), Y = p => P.t + (hi - p) / (hi - lo) * (H - P.t - P.b);

    if (res.ok) { const j = await res.json(); return { text: j.csv, log: j.log, time: new Date(j.time), auto: true }; }

  return { text, log, time: new Date(), auto: false };

/* ---------- vuốt chạm chuẩn iOS 120Hz: đóng sheet 1:1 theo vsync & lướt thanh chọn kỳ ---------- */
const dlgEl = $('dlg'), reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
let closingDlg = false;
function closeDlg(fromSwipe) {
  if (!dlgEl.open || closingDlg) return;
  if (reduceMotion.matches) { dlgEl.style.transform = ''; dlgEl.style.transition = ''; dlgEl.close(); return; }
  closingDlg = true;
  if (fromSwipe) {
    dlgEl.style.transition = 'transform .28s var(--ios)';
    dlgEl.style.transform = 'translate3d(0,100%,0)';
  } else {
    dlgEl.style.transform = '';
    dlgEl.style.transition = '';
    dlgEl.classList.add('closing');
  }
  const done = () => {
    clearTimeout(fb);
    dlgEl.removeEventListener('transitionend', onEnd);
    dlgEl.classList.remove('closing');
    dlgEl.style.transform = '';
    dlgEl.style.transition = '';
    closingDlg = false;
    if (dlgEl.open) dlgEl.close();
  };
  const onEnd = e => { if (e.target === dlgEl && (e.propertyName === 'transform' || e.propertyName === 'opacity')) done(); };
  const fb = setTimeout(done, 310);
  dlgEl.addEventListener('transitionend', onEnd);
}
dlgEl.addEventListener('cancel', e => { e.preventDefault(); closeDlg(); });
dlgEl.addEventListener('close', () => { S.open = null; closingDlg = false; dlgEl.style.transform = ''; dlgEl.style.transition = ''; dlgEl.classList.remove('closing'); $('tip').style.display = 'none'; });

// Vuốt xuống để đóng bottom sheet (đồng bộ từng frame 120Hz qua requestAnimationFrame)
let shDrag = null, shRaf = 0;
dlgEl.addEventListener('touchstart', e => {
  if (!dlgEl.open || closingDlg || e.touches.length !== 1) return;
  if (e.target.closest('button, a, input, select, .chart')) return;
  const onHeader = !!e.target.closest('.dlg-h');
  if (!onHeader && dlgEl.scrollTop > 1) return;
  const t = e.touches[0];
  shDrag = { sx: t.clientX, sy: t.clientY, ly: t.clientY, py: t.clientY, lt: performance.now(), pt: performance.now(), active: false, cur: 0 };
}, { passive: true });
dlgEl.addEventListener('touchmove', e => {
  if (!shDrag || e.touches.length !== 1) return;
  const t = e.touches[0], dx = t.clientX - shDrag.sx, dy = t.clientY - shDrag.sy;
  if (!shDrag.active) {
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) { shDrag = null; return; }
    if (dy > 6 && (dlgEl.scrollTop <= 1 || !!e.target.closest('.dlg-h'))) {
      shDrag.active = true;
      dlgEl.style.transition = 'none';
    } else if (dy < -6) { shDrag = null; return; }
    else return;
  }
  e.preventDefault();
  const now = performance.now();
  shDrag.py = shDrag.ly; shDrag.pt = shDrag.lt;
  shDrag.ly = t.clientY; shDrag.lt = now;
  shDrag.cur = dy > 0 ? dy : dy * 0.18;
  if (!shRaf) {
    shRaf = requestAnimationFrame(() => {
      shRaf = 0;
      if (shDrag) dlgEl.style.transform = `translate3d(0,${shDrag.cur.toFixed(1)}px,0)`;
    });
  }
}, { passive: false });
function endSheetDrag() {
  if (!shDrag) return;
  if (shRaf) { cancelAnimationFrame(shRaf); shRaf = 0; }
  const d = shDrag; shDrag = null;
  if (!d.active) return;
  const dt = Math.max(1, d.lt - d.pt), vy = (d.ly - d.py) / dt;
  if (d.cur > 110 || (d.cur > 24 && vy > 0.55)) closeDlg(true);
  else {
    dlgEl.style.transition = 'transform .34s var(--ios)';
    dlgEl.style.transform = 'translate3d(0,0,0)';
    setTimeout(() => { if (!shDrag && !closingDlg) { dlgEl.style.transition = ''; dlgEl.style.transform = ''; } }, 360);
  }
}
dlgEl.addEventListener('touchend', endSheetDrag, { passive: true });
dlgEl.addEventListener('touchcancel', endSheetDrag, { passive: true });

// Lướt ngón tay qua thanh chọn kỳ (#range) kiểu UISegmentedControl iOS (viên kính bám tức thì, render theo rAF)
let segSliding = false, segRaf = 0;
$('range').addEventListener('touchstart', e => { if (e.touches.length === 1) segSliding = true; }, { passive: true });
$('range').addEventListener('touchmove', e => {
  if (!segSliding || e.touches.length !== 1) return;
  e.preventDefault();
  const t = e.touches[0], el = document.elementFromPoint(t.clientX, t.clientY)?.closest('#range [data-r]');
  if (el && +el.dataset.r !== S.range) {
    S.range = +el.dataset.r;
    syncRangeDom(); seg($('range'));
    if (!segRaf) segRaf = requestAnimationFrame(() => { segRaf = 0; render(); });
  }
}, { passive: false });
const endSegSlide = () => { segSliding = false; };
$('range').addEventListener('touchend', endSegSlide, { passive: true });
$('range').addEventListener('touchcancel', endSegSlide, { passive: true });

let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => S.items.length && render(), 150); });

$('refresh').addEventListener('click', () => S.link && load(S.link, true));

/* ---------- giao diện: sáng / tối / tự động, độ trong của kính, hiệu ứng ---------- */
const root = document.documentElement, THEMES = [['', '◐', 'tự động theo máy'], ['light', '☀', 'ban ngày'], ['dark', '☾', 'ban đêm']];
function setTheme(k) {
  const [, icon, name] = THEMES.find(x => x[0] === k) || THEMES[0];
  if (k) root.dataset.theme = k; else delete root.dataset.theme;
  $('theme').textContent = icon; $('theme').title = 'Giao diện: ' + name;
  try { localStorage.setItem('theme', k); } catch { }
}
let want = root.dataset.theme || ''; // chế độ đích; callback của view transition có thể chạy trễ nên chỉ áp đúng giá trị này
setTheme(want);
$('theme').addEventListener('click', () => {
  want = THEMES[(THEMES.findIndex(x => x[0] === want) + 1) % THEMES.length][0];
  const go = () => setTheme(want);
  document.startViewTransition ? document.startViewTransition(go) : go();
});
$('tint').value = getComputedStyle(root).getPropertyValue('--tint').trim() || .35;
$('tint').addEventListener('input', e => { root.style.setProperty('--tint', e.target.value); try { localStorage.setItem('tint', e.target.value); } catch { } });
let scRaf = 0;
addEventListener('scroll', () => {
  if (scRaf) return;
  scRaf = requestAnimationFrame(() => { scRaf = 0; document.body.classList.toggle('scrolled', scrollY > 40); });
}, { passive: true });
if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  let pmRaf = 0, pmE = null;
  addEventListener('pointermove', e => { // vệt sáng trên kính chạy theo con trỏ (chỉ desktop, synced rAF)
    pmE = e; if (pmRaf) return;
    pmRaf = requestAnimationFrame(() => {
      pmRaf = 0; if (!pmE) return;
      const g = pmE.target?.closest?.('.kpi,.card'); if (!g) return;
      const r = g.getBoundingClientRect();
      g.style.setProperty('--mx', pmE.clientX - r.left + 'px');
      g.style.setProperty('--my', pmE.clientY - r.top + 'px');
    });
  }, { passive: true });
}

openSheet(new URLSearchParams(location.search).get('sheet') || DEFAULT_LINK);
</script>
</body>
</html>
