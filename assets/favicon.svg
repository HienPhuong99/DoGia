<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <clipPath id="sq">
      <rect x="2" y="2" width="60" height="60" rx="16"/>
    </clipPath>
    <linearGradient id="bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eaf1ff"/>
      <stop offset="100%" stop-color="#f2ecff"/>
    </linearGradient>
    <radialGradient id="b1" cx="22%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#7ec3ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7ec3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="84%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#c6a8ff" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#c6a8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="80%" cy="82%" r="52%">
      <stop offset="0%" stop-color="#ffb3c6" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffb3c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b4" cx="20%" cy="84%" r="50%">
      <stop offset="0%" stop-color="#9eeed3" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#9eeed3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tagFill" x1="12" y1="16" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#eaf4ff" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="tagRim" x1="12" y1="16" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#4ea1ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="wave" x1="18" y1="34" x2="40" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052d9"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
    <path id="tag" d="M 16 18 L 38 18 C 40.5 18 42.8 19 44.5 20.6 L 51 27 C 53.6 29.6 53.6 34.4 51 37 L 44.5 43.4 C 42.8 45 40.5 46 38 46 L 16 46 C 12.2 46 9.5 43.3 9.5 39.5 L 9.5 24.5 C 9.5 20.7 12.2 18 16 18 Z"/>
    <mask id="cut">
      <rect width="64" height="64" fill="#000"/>
      <use href="#tag" fill="#fff"/>
      <circle cx="44.5" cy="32" r="3.4" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="2" y="2" width="60" height="60" fill="url(#bg)"/>
    <rect x="2" y="2" width="60" height="60" fill="url(#b1)"/>
    <rect x="2" y="2" width="60" height="60" fill="url(#b2)"/>
    <rect x="2" y="2" width="60" height="60" fill="url(#b3)"/>
    <rect x="2" y="2" width="60" height="60" fill="url(#b4)"/>
  </g>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1"/>

  <g transform="translate(32 32) scale(1.06) rotate(-45) translate(-32 -32)">
    <g mask="url(#cut)">
      <use href="#tag" fill="url(#tagFill)"/>
    </g>
    <use href="#tag" stroke="url(#tagRim)" stroke-width="2"/>
    <circle cx="44.5" cy="32" r="3.4" stroke="url(#tagRim)" stroke-width="1.6"/>
    <path d="M 15.5 33.4 C 19.5 29.4, 23 29.4, 26.5 32.2 C 30 35, 33.8 34.8, 37.8 29.8"
