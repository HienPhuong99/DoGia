name: Chụp lịch sử giá
on:
  schedule:
    - cron: '0 */3 * * *'   # 3 tiếng/lần
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/snapshot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --cached --quiet || (git commit -m "Chụp giá $(TZ=Asia/Ho_Chi_Minh date +%F)" && git push)
